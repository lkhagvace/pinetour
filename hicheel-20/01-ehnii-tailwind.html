<!doctype html>
<html lang="mn">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>01 · Анхны Tailwind</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  </head>
  <body class="bg-slate-100 p-8">
    <!-- 1. Class алга: Tailwind анхны загварыг арилгадаг тул h2 жижиг, энгийн -->
    <h2>Энэ h2-д class алга</h2>

    <!-- 2. Class нэмбэл -->
    <h1 class="text-3xl font-bold mt-6">Сайн уу, Tailwind! 👋</h1>
    <p class="text-gray-500 mt-2">CSS файл бичихгүйгээр загварчилж байна.</p>

    <!-- 3. Товч: bg → text → px py → rounded → font, нэг нэгээр нэм -->
    <button class="bg-blue-600 text-white px-6 py-3 rounded-lg font-bold mt-6">
      Захиалах
    </button>
  </body>
</html>
